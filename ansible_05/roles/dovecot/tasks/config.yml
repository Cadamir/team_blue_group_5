---
# tasks file for roles/postfix
- name: Dovecot 10-mail konfigurieren
  ansible.builtin.template:
    src: 10-mail.conf.j2
    dest: /etc/dovecot/conf.d/10-mail.conf
    owner: root
    group: root
    mode: "06444"

- name: Dovecot 10-auth konfigurieren
  ansible.builtin.template:
    src: 10-auth.conf.j2
    dest: /etc/dovecot/conf.d/10-auth.conf
    owner: root
    group: root
    mode: "06444"
